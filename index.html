<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🌋 VOLCANO POS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --water:#185FA5;--water-bg:#E6F1FB;--water-t:#0C447C;
  --fire:#BA7517;--fire-bg:#FAEEDA;--fire-t:#633806;
  --noodle:#0F6E56;--noodle-bg:#E1F5EE;--noodle-t:#085041;
  --bg:#f5f4f0;--card:#ffffff;--border:#e0ddd6;--border2:#c8c4bb;
  --text:#1a1a1a;--text2:#555;--text3:#999;
  --radius:10px;--radius-lg:14px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1c1c1e;--card:#2c2c2e;--border:#3a3a3c;--border2:#48484a;--text:#f2f2f7;--text2:#aeaeb2;--text3:#636366;}
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-size:15px;font-weight:700;color:var(--text)}.logo em{color:var(--fire);font-style:normal}
.vtabs{display:flex;gap:4px}
.vtab{padding:6px 12px;border:1px solid var(--border2);border-radius:99px;background:transparent;cursor:pointer;font-size:12px;font-weight:500;color:var(--text2);font-family:inherit}
.vtab.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.table-bar{padding:7px 12px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.table-row1{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.table-label{font-size:12px;font-weight:700;color:var(--text2);white-space:nowrap}
.tno-custom{width:58px;padding:5px 7px;border:1px solid var(--border);border-radius:99px;background:var(--bg);font-size:12px;color:var(--text);text-align:center;font-family:inherit}
.table-scroll{display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.table-scroll::-webkit-scrollbar{display:none}
.tno-btn{padding:5px 10px;border:1px solid var(--border);border-radius:99px;background:var(--bg);cursor:pointer;font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap;flex-shrink:0;font-family:inherit}
.tno-btn.on{background:var(--fire);color:#fff;border-color:var(--fire)}
.view{display:none;flex:1;overflow:hidden;flex-direction:column}.view.on{display:flex}
.station-tabs{display:flex;gap:6px;padding:9px 12px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.stab{flex:1;padding:7px 4px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);cursor:pointer;font-size:11px;font-weight:600;color:var(--text2);text-align:center;line-height:1.5;font-family:inherit}
.stab.on-water{background:var(--water-bg);color:var(--water-t);border-color:var(--water)}
.stab.on-fire{background:var(--fire-bg);color:var(--fire-t);border-color:var(--fire)}
.stab.on-noodle{background:var(--noodle-bg);color:var(--noodle-t);border-color:var(--noodle)}
.order-body{display:flex;flex:1;overflow:hidden;flex-direction:column}
.menu-scroll{flex:1;overflow-y:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
.panel{display:none}.panel.on{display:block}
.sec-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin:10px 0 5px}
.sec-title:first-child{margin-top:0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:6px;margin-bottom:4px}
.mitem{padding:9px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);cursor:pointer}
.mitem:active{opacity:.65}
.mitem .zh{font-size:12px;font-weight:600;color:var(--text)}
.mitem .en{font-size:10px;color:var(--text3);margin-top:1px;line-height:1.3}
.mitem .pr{font-size:12px;font-weight:500;color:var(--text2);margin-top:4px}
.mitem.paused{opacity:.42;position:relative}
.mitem.paused::after{content:'Paused';position:absolute;top:5px;right:7px;font-size:9px;font-weight:700;color:#fff;background:#c0392b;border-radius:4px;padding:1px 5px}
.cart-area{background:var(--card);border-top:1px solid var(--border);padding:10px 12px;flex-shrink:0;max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cart-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cart-title{font-size:13px;font-weight:600;color:var(--text)}
.clr-btn{font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;padding:2px 4px;font-family:inherit}
.crow{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--border)}
.crow:last-of-type{border-bottom:none}
.cbadge{font-size:9px;padding:2px 5px;border-radius:99px;white-space:nowrap;font-weight:600;flex-shrink:0}
.bw{background:var(--water-bg);color:var(--water-t)}.bf{background:var(--fire-bg);color:var(--fire-t)}.bn{background:var(--noodle-bg);color:var(--noodle-t)}
.cname{flex:1;font-size:12px;color:var(--text);line-height:1.3}
.cmods{font-size:10px;color:var(--text3);margin-top:1px}
.cmods.fire{color:var(--fire-t);font-weight:600}
.cmods.water{color:var(--water-t);font-weight:600}
.qbtn{width:26px;height:26px;border:1px solid var(--border2);border-radius:50%;background:var(--bg);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0;line-height:1;font-family:inherit}
.qty{font-size:12px;font-weight:600;min-width:18px;text-align:center;color:var(--text)}
.cprice{font-size:12px;color:var(--text2);min-width:40px;text-align:right;font-weight:500;flex-shrink:0}
.cart-foot-inner{padding-top:8px;border-top:1px solid var(--border);margin-top:6px}
.rmk{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);font-size:12px;color:var(--text);margin-bottom:8px;font-family:inherit}
.total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.total-lbl{font-size:13px;font-weight:600;color:var(--text)}
.total-amt{font-size:19px;font-weight:700;color:var(--text)}
.send-btn{width:100%;padding:13px;border:none;border-radius:var(--radius);cursor:pointer;font-size:14px;font-weight:700;color:#fff;background:#25D366;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
.send-btn:active{opacity:.8}
.empty-msg{font-size:12px;color:var(--text3);text-align:center;padding:12px 0}
.table-warn{font-size:11px;color:var(--fire-t);background:var(--fire-bg);border-radius:6px;padding:5px 8px;margin-bottom:6px;text-align:center;display:none}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end}
.modal-overlay.on{display:flex}
.modal-sheet{background:var(--card);border-radius:18px 18px 0 0;padding:16px 14px 36px;width:100%;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 14px}
.modal-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px}
.modal-sub{font-size:11px;color:var(--text3);margin-bottom:14px}
.mod-group{margin-bottom:14px}
.mod-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.mod-hint{font-size:10px;color:var(--text3);font-weight:400;text-transform:none;letter-spacing:0;margin-bottom:6px;line-height:1.5}
.mod-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.mod-opt{padding:7px 12px;border:1px solid var(--border);border-radius:99px;background:var(--bg);cursor:pointer;font-size:12px;color:var(--text2);font-family:inherit}
.mod-opt:active{opacity:.7}
.mod-opt.sel-w{background:var(--water-bg);color:var(--water-t);border-color:var(--water);font-weight:600}
.mod-opt.sel-f{background:var(--fire-bg);color:var(--fire-t);border-color:var(--fire);font-weight:600}
.mod-opt.sel-n{background:var(--noodle-bg);color:var(--noodle-t);border-color:var(--noodle);font-weight:600}
.mod-opt.fire-needed{border-color:var(--fire);border-style:dashed}
.mod-opt.extra-charge{border-color:#c0392b}
.fire-badge{font-size:9px;background:var(--fire);color:#fff;border-radius:3px;padding:1px 3px;margin-left:3px;vertical-align:middle}
.extra-badge{font-size:9px;background:#c0392b;color:#fff;border-radius:3px;padding:1px 3px;margin-left:3px;vertical-align:middle}
.topping-status{font-size:11px;margin-top:6px;padding:5px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--border)}
.topping-status.over{border-color:var(--fire);color:var(--fire-t);background:var(--fire-bg)}
.section-divider{border:none;border-top:1px solid var(--border);margin:12px 0 10px}
.size-opts{display:flex;gap:6px;margin-top:4px}
.size-opt{flex:1;padding:8px 4px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);cursor:pointer;font-size:11px;font-weight:600;color:var(--text2);text-align:center;font-family:inherit}
.size-opt.sel-w{background:var(--water-bg);color:var(--water-t);border-color:var(--water)}
.size-opt.sel-f{background:var(--fire-bg);color:var(--fire-t);border-color:var(--fire)}
.size-opt.sel-n{background:var(--noodle-bg);color:var(--noodle-t);border-color:var(--noodle)}
.modal-btns{display:flex;gap:8px;margin-top:16px}
.modal-cancel{flex:0 0 80px;padding:12px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);cursor:pointer;font-size:13px;color:var(--text2);font-family:inherit}
.modal-confirm{flex:1;padding:12px;border:none;border-radius:var(--radius);background:var(--fire);color:#fff;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit}
.no-orders{font-size:12px;color:var(--text3);text-align:center;padding:14px 0}
.manage-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:flex-end}
.manage-overlay.on{display:flex}
.manage-sheet{background:var(--card);border-radius:18px 18px 0 0;padding:16px 14px 36px;width:100%;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.manage-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.manage-row:last-of-type{border-bottom:none}
.manage-name{flex:1;font-size:12px;font-weight:600;color:var(--text)}
.manage-price{font-size:12px;color:var(--text2);margin-right:6px}
.pause-btn{padding:5px 11px;border:1px solid var(--border2);border-radius:99px;background:var(--bg);cursor:pointer;font-size:11px;font-weight:600;color:var(--text2);font-family:inherit}
.pause-btn.paused{background:#c0392b;color:#fff;border-color:#c0392b}
.manage-sec{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;padding:10px 0 4px}
.wa-info{background:#dcf8c6;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:11px;color:#075e54}
.wa-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.wa-row:last-of-type{border-bottom:none}
.wa-station{font-weight:600;color:var(--text)}
.wa-num{color:var(--text3);font-family:monospace}
.history-card{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;background:var(--card)}
.history-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.history-table{font-size:12px;font-weight:700;background:var(--fire);color:#fff;border-radius:6px;padding:2px 8px}
.history-time{font-size:11px;color:var(--text3)}
.history-tot{font-size:13px;font-weight:700;color:var(--text)}
.history-items{font-size:11px;color:var(--text2);margin-top:4px;line-height:1.5}
.req{color:#c0392b;font-weight:700}
.modal-err{display:none;background:#fdecea;color:#a1261a;border:1px solid #e0a8a2;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:600;margin-top:10px}
.csum{font-size:10px;color:var(--text3);margin-top:1px;line-height:1.4}
.history-items div{margin-bottom:3px}
.history-items .hsub{color:var(--text3);font-size:10px;padding-left:8px}
</style>
</head>
<body>
<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="logo">🌋 <em>VOLCANO</em> POS</div>
    <div class="vtabs">
      <button class="vtab on" id="vv-order" onclick="vswitch('order')">Order</button>
      <button class="vtab" id="vv-history" onclick="vswitch('history')">History</button>
      <button class="vtab" onclick="openManage()">Manage</button>
    </div>
  </div>

  <!-- ORDER VIEW -->
  <div class="view on" id="view-order">
    <div class="table-bar">
      <div class="table-row1">
        <span class="table-label">🪑 Table</span>
        <input class="tno-custom" id="tno-custom" type="text" inputmode="numeric" placeholder="Other" oninput="setTableCustom(this.value)">
        <span id="cur-table-display" style="font-size:12px;font-weight:700;color:var(--fire);margin-left:4px"></span>
      </div>
      <div class="table-scroll" id="table-scroll"></div>
    </div>
    <div class="station-tabs">
      <button class="stab on-water" id="tb-water" onclick="stabSwitch('water')">💧 Drinks<br>Station</button>
      <button class="stab" id="tb-fire" onclick="stabSwitch('fire')">🔥 Fire<br>Station</button>
      <button class="stab" id="tb-noodle" onclick="stabSwitch('noodle')">🍜 Noodle<br>Station</button>
    </div>
    <div class="order-body">
      <div class="menu-scroll">
        <div id="p-water" class="panel on"></div>
        <div id="p-fire" class="panel"></div>
        <div id="p-noodle" class="panel"></div>
      </div>
      <div class="cart-area">
        <div class="cart-hd">
          <span class="cart-title">Current Order</span>
          <button class="clr-btn" onclick="clearCart()">Clear</button>
        </div>
        <div id="cart-list"><div class="empty-msg">Select items above</div></div>
        <div id="cart-foot" style="display:none">
          <div class="cart-foot-inner">
            <div class="table-warn" id="table-warn">⚠️ Please select a table</div>
            <input class="rmk" id="rmk" placeholder="Order note (special requests…)">
            <div class="total-row">
              <span class="total-lbl">Total</span>
              <span class="total-amt" id="tot">£0.00</span>
            </div>
            <button class="send-btn" onclick="sendOrder()">📲 Place order (copy message + open WhatsApp group)</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- HISTORY VIEW -->
  <div class="view" id="view-history">
    <div class="station-view-body" style="flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch" id="history-body">
      <div class="no-orders">No order history yet</div>
    </div>
  </div>
</div>

<!-- ITEM MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-sheet" id="modal-sheet"></div>
</div>

<!-- MANAGE MODAL -->
<div class="manage-overlay" id="manage-overlay">
  <div class="manage-sheet" id="manage-sheet"></div>
</div>

<script>
// ═════════════════════════════════════════════════════════════
// VOLCANO POS — script
// Data layer: every option has a stable `id`. Kitchen routing, pricing
// and WhatsApp messages are driven by ids / structured data, never by
// display names or reconstructed display strings.
// ═════════════════════════════════════════════════════════════

// WhatsApp group (unchanged)
var WA_GROUP_LINK = 'https://chat.whatsapp.com/IP4B7ppeDRDJfS5V4PilIf?s=hd&p=i&mlu=4&ilr=4';

var STATION_NAME = {water:'Drinks Station', fire:'Fire Station', noodle:'Noodle Station'};
var STATION_ICON = {water:'💧', fire:'🔥', noodle:'🍜'};

// ── Runtime state ──
var MENU_ITEMS = [];
var cart = [];
var orderHistory = [];
var oNo = 1;
var pendingItem = null;     // menu item currently open in the modal
var custSel = {};           // simple single-choice selections: {side, sauce, toast, rice_sauce, spice, noodle_type}
var selToppings = [];       // noodle toppings: [{id}]
var selGarnish = [];        // garnish ids
var drinkSel = null;        // drink being configured in the modal (independent per modal session)
var currentTable = '';
var pausedItems = {};       // keyed by menu item id (not array index)

// ── Drink option lists (exactly five sugar + five ice levels; ids are unique per list) ──
var SUGAR_OPTS = [
  {id:'more',   label:'More Sugar'},
  {id:'normal', label:'Normal Sugar'},
  {id:'half',   label:'Half Sugar'},
  {id:'less',   label:'Less Sugar'},
  {id:'none',   label:'No Sugar'}
];
var ICE_OPTS = [
  {id:'more',   label:'More Ice'},
  {id:'normal', label:'Normal Ice'},
  {id:'half',   label:'Half Ice'},
  {id:'less',   label:'Less Ice'},
  {id:'none',   label:'No Ice'}
];
var MILK_OPTS = [
  {id:'whole', label:'Whole Milk'},
  {id:'oat',   label:'Oat Drink'}
];
var TEMP_OPTS = [
  {id:'cold', label:'Cold'},
  {id:'hot',  label:'Hot'}
];
var DRINK_TOPPINGS = [
  {id:'tapioca',        label:'Tapioca'},
  {id:'red_bean',       label:'Red Bean'},
  {id:'lychee_pop',     label:'Lychee Popping Ball'},
  {id:'peach_pop',      label:'Peach Popping Ball'},
  {id:'strawberry_pop', label:'Strawberry Popping Ball'},
  {id:'mango_pop',      label:'Mango Popping Ball'}
];
var DRINK_TOPPING_EXTRA = 0.5;   // per additional topping scoop

// ── Drink definitions ──
// type: milktea | fruittea | matcha | soft
var DRINK_LIST = [
  {id:'tw_milk_tea',      name:'Taiwanese Milk Tea',     menuName:'Taiwanese Milk Tea with Tapioca',   type:'milktea',  includes:'Tapioca'},
  {id:'bs_milk_tea',      name:'Brown Sugar Milk Tea',   menuName:'Brown Sugar Milk Tea with Tapioca', type:'milktea',  includes:'Tapioca'},
  {id:'choc_milk_tea',    name:'Chocolate Milk Tea',     menuName:'Chocolate Milk Tea with Tapioca',   type:'milktea',  includes:'Tapioca'},
  {id:'coconut_milk_tea', name:'Coconut Milk Tea',       menuName:'Coconut Milk Tea with Red Bean',    type:'milktea',  includes:'Red Bean'},
  {id:'mango_tea',        name:'Mango Fruit Tea',        menuName:'Mango Fruit Tea',                   type:'fruittea', includes:'a popping ball'},
  {id:'lychee_tea',       name:'Lychee Fruit Tea',       menuName:'Lychee Fruit Tea',                  type:'fruittea', includes:'a popping ball'},
  {id:'peach_tea',        name:'White Peach Fruit Tea',  menuName:'White Peach Fruit Tea',             type:'fruittea', includes:'a popping ball'},
  {id:'lemon_tea',        name:'Lemon Fruit Tea',        menuName:'Lemon Fruit Tea',                   type:'fruittea', includes:'a popping ball'},
  {id:'matcha',           name:'Matcha Latte with Red Bean', menuName:'Matcha Latte with Red Bean',    type:'matcha',   includes:'Red Bean'},
  {id:'soft',             name:'Soft Drink',             menuName:'Soft Drink',                        type:'soft',     includes:''}
];
var DRINKS = {};
DRINK_LIST.forEach(function(d){ DRINKS[d.id] = d; });

// ── Simple option groups (single choice). `req` = must be chosen. ──
var MODS = {
  side:  {label:'Side', req:true,  opts:[{id:'rice', label:'Rice'}, {id:'chips', label:'Chips'}]},
  sauce: {label:'Sauce', req:true, opts:[{id:'curry', label:'Japanese Curry'}, {id:'teriyaki', label:'Teriyaki'}]},
  toast: {label:'Filling', req:true, opts:[
    {id:'peanut',   label:'Peanut Butter'},
    {id:'nutella',  label:'Nutella'},
    {id:'pistachio',label:'Pistachio'}
  ]},
  rice_sauce: {label:'Extra sauce', req:false, opts:[
    {id:'none',     label:'No Extra Sauce', price:0},
    {id:'curry',    label:'Japanese Curry', price:1},
    {id:'teriyaki', label:'Teriyaki',       price:1}
  ]},
  noodle_type: {label:'Noodle base', req:true, opts:[
    {id:'rice',   label:'Rice Noodles',          price:0},
    {id:'udon',   label:'Udon',                  price:0.5},
    {id:'korean', label:'Korean Instant Noodles',price:1}
  ]},
  spice: {label:'Spice level', req:false, opts:[
    {id:'none',   label:'No Spice'},
    {id:'mild',   label:'Mild'},
    {id:'medium', label:'Medium'},
    {id:'hot',    label:'Hot'}
  ]}
};

// ── Noodle toppings (first one included; each additional +£2.00; `sur` = item surcharge, always charged) ──
var TOPPINGS = [
  {id:'beef_ball',       name:'Signature Volcano Beef Ball',         sur:0},
  {id:'shrimp_wonton',   name:'Fresh Shrimp & Chicken Wonton',       sur:0},
  {id:'cheese_fish_tofu',name:'Cheese Fish Tofu',                    sur:0},
  {id:'fish_ball',       name:'Fish Ball',                           sur:0},
  {id:'cuttlefish_ball', name:'Cuttlefish Ball',                     sur:0},
  {id:'beef_slices',     name:'Beef Slices',                         sur:0},
  {id:'beef_shin',       name:'Five-Spice Beef Shin',                sur:0},
  {id:'braised_tofu',    name:'Braised Tofu',                        sur:0},

// ═════════════════════════════════════════════════════════════
// HELPERS
// ═════════════════════════════════════════════════════════════
function r2(n){ return Math.round(n * 100) / 100; }
function gbp(n){ return '£' + r2(n).toFixed(2); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function byId(list, id){
  for (var i = 0; i < list.length; i++) { if (list[i].id === id) return list[i]; }
  return null;
}
function labelOf(list, id){ var o = byId(list, id); return o ? o.label : ''; }
function selClassFor(st){ return st === 'water' ? 'sel-w' : (st === 'fire' ? 'sel-f' : 'sel-n'); }
function toppingName(id){ var t = byId(TOPPINGS, id); return t ? t.name : id; }
function drinkToppingLabel(id){ return labelOf(DRINK_TOPPINGS, id) || id; }
function drinkCtx(item){ return item.drink ? 'standalone' : (item.st === 'fire' ? 'set' : 'noodle'); }

// ═════════════════════════════════════════════════════════════
// DRINK RULES (single source of truth for sizes, temperatures, prices)
// ═════════════════════════════════════════════════════════════
// Which temperatures can be chosen. Hot is only offered for standalone milk tea / matcha.
// (Hot with set meals / noodle bowls is not stated on the menu → not offered; flagged for confirmation.)
function drinkTemps(def, ctx){
  if (def.type === 'soft' || def.type === 'fruittea') return [];
  return (ctx === 'standalone') ? ['cold', 'hot'] : ['cold'];
}
function drinkSizes(def, temp){
  if (def.type === 'soft') return [];
  if (def.type === 'matcha')  return temp === 'hot' ? [350] : [500];
  if (def.type === 'milktea') return temp === 'hot' ? [350] : [500, 700];
  return [500, 700];                               // fruit tea (cold only)
}
// Menu list price. Hot milk tea price is not stated separately → uses the existing £4.00 (to confirm).
function drinkListPrice(def, size, temp){
  if (def.type === 'soft')   return 2;
  if (def.type === 'matcha') return 5;
  if (temp === 'hot')        return 4;
  return size === 700 ? 5 : 4;
}
// Price of a configured drink in a given context:
//   standalone → list price
//   set        → 500ml included; 700ml +£1; Matcha +£1 supplement
//   noodle     → 50% off the list price of the chosen size
// plus £0.50 for each topping after the first (first topping = free swap of the included topping)
function drinkPrice(def, d, ctx){
  var temp = d.temp || 'cold';
  var size = d.size || drinkSizes(def, temp)[0];
  var list = drinkListPrice(def, size, temp);
  var base;
  if (ctx === 'set') {
    base = 0;
    if (def.type === 'matcha') base += 1;
    if (size === 700) base += 1;
  } else if (ctx === 'noodle') {
    base = list / 2;
  } else {
    base = list;
  }
  var nTop = (d.toppings || []).length;
  return r2(base + Math.max(0, nTop - 1) * DRINK_TOPPING_EXTRA);
}

function newDrinkSel(id){
  var def = DRINKS[id];
  var d = {id:id, size:null, temp:null, milk:null, sugar:null, ice:null, toppings:[]};
  if (def.type === 'soft') return d;
  if (def.type === 'milktea' || def.type === 'matcha') d.temp = 'cold';
  d.size = drinkSizes(def, d.temp || 'cold')[0];
  return d;
}
// Copy of a drink selection that is safe to store (fresh object, only fields relevant to the drink type)
function cleanDrink(d){
  if (!d || !DRINKS[d.id]) return null;
  var def = DRINKS[d.id];
  var o = {id:d.id};
  if (def.type === 'soft') return o;
  o.size   = d.size || null;
  o.temp   = (def.type === 'milktea' || def.type === 'matcha') ? (d.temp || 'cold') : null;
  o.milk   = (def.type === 'milktea' || def.type === 'matcha') ? (d.milk || null) : null;
  o.sugar  = d.sugar || null;
  o.ice    = (o.temp === 'hot') ? null : (d.ice || null);      // hot drinks never carry an ice level
  o.toppings = (d.toppings || []).slice();
  return o;
}

// ═════════════════════════════════════════════════════════════
// PRICING (used by the modal preview, the cart and the order total)
// ═════════════════════════════════════════════════════════════
function toppingsCost(ids){
  var c = Math.max(0, ids.length - 1) * TOPPING_EXTRA;       // first topping included
  ids.forEach(function(id){ var t = byId(TOPPINGS, id); if (t) c += t.sur; });   // item surcharges always apply
  return r2(c);
}
function calcItemPrice(item, s){
  if (item.drink) {
    return drinkPrice(DRINKS[item.drink], s.drink || {id:item.drink, toppings:[]}, 'standalone');
  }
  var t = item.p;
  if (s.noodleBase) { var nb = byId(MODS.noodle_type.opts, s.noodleBase); if (nb) t += nb.price || 0; }
  if (s.riceSauce)  { var rs = byId(MODS.rice_sauce.opts, s.riceSauce);  if (rs) t += rs.price || 0; }
  if (s.toppings && s.toppings.length) t += toppingsCost(s.toppings);
  (s.garnish || []).forEach(function(id){ var g = byId(GARNISH_OPTS, id); if (g && g.price) t += g.price; });
  if (s.drink) t += drinkPrice(DRINKS[s.drink.id], s.drink, drinkCtx(item));
  return r2(t);
}

// ═════════════════════════════════════════════════════════════
// STRUCTURED ORDER DATA — the primary source for cart, history and WhatsApp
// ═════════════════════════════════════════════════════════════
function buildStructured(item){
  var s = {
    v: 2, itemId: item.id, name: item.name, st: item.st,
    side:      custSel.side || null,
    sauce:     custSel.sauce || null,
    filling:   custSel.toast || null,
    riceSauce: custSel.rice_sauce || null,
    spice:     custSel.spice || null,
    noodleBase:custSel.noodle_type || null,
    extraNoodles: false,
    toppings: selToppings.map(function(t){ return t.id; }),
    garnish:  selGarnish.slice(),
    drink:    drinkSel ? cleanDrink(drinkSel) : null
  };
  s.extraNoodles = s.garnish.indexOf('extra_noodles') > -1;
  return s;
}

// ── Human-readable text (cart + history + CSV). WhatsApp does NOT parse these strings. ──
function drinkDetail(d){
  var def = DRINKS[d.id], p = [];
  if (d.size)  p.push(d.size + 'ml');
  if (def.type === 'milktea' || def.type === 'matcha') p.push(d.temp === 'hot' ? 'Hot' : 'Cold');
  if (d.milk)  p.push(labelOf(MILK_OPTS, d.milk));
  if (d.sugar) p.push(labelOf(SUGAR_OPTS, d.sugar));
  if (d.temp !== 'hot' && d.ice) p.push(labelOf(ICE_OPTS, d.ice));
  if (d.toppings && d.toppings.length) p.push('Toppings: ' + d.toppings.map(drinkToppingLabel).join(', '));
  return p.join(' · ');
}
function drinkSummary(d){
  var det = drinkDetail(d);
  return DRINKS[d.id].name + (det ? ' · ' + det : '');
}
function summaryLines(item, s){
  var L = [];
  if (s.side)      L.push('Side: ' + labelOf(MODS.side.opts, s.side));
  if (s.sauce)     L.push('Sauce: ' + labelOf(MODS.sauce.opts, s.sauce));
  if (s.filling)   L.push('Filling: ' + labelOf(MODS.toast.opts, s.filling));
  if (s.riceSauce && s.riceSauce !== 'none') L.push('Sauce: ' + labelOf(MODS.rice_sauce.opts, s.riceSauce));
  if (s.noodleBase)L.push('Noodle base: ' + labelOf(MODS.noodle_type.opts, s.noodleBase));
  if (s.spice)     L.push('Spice: ' + labelOf(MODS.spice.opts, s.spice));
  if (s.toppings && s.toppings.length) L.push('Toppings: ' + s.toppings.map(toppingName).join(', '));
  var g = (s.garnish || []).filter(function(id){ return id !== 'extra_noodles'; })
                            .map(function(id){ return labelOf(GARNISH_OPTS, id); });
  if (g.length) L.push('Garnish: ' + g.join(', '));
  if (s.extraNoodles) L.push('Extra noodles');
  if (s.drink) {
    if (item.drink) { var det = drinkDetail(s.drink); if (det) L.push(det); }
    else L.push('Drink: ' + drinkSummary(s.drink));
  }
  return L;
}
function fireToppingIds(s){
  return (s && s.toppings ? s.toppings : []).filter(routesToFire);
}

  for (var s = 0; s < stKeys.length; s++) {

             '<div class="zh">' + esc(item.name) + '</div>' +
             (item.desc ? '<div class="en">' + esc(item.desc) + '</div>' : '') +
             '<div class="pr">' + gbp(item.p) + '</div></div>';

      h += '</div>';

// ═════════════════════════════════════════════════════════════
// ITEM MODAL
// ═════════════════════════════════════════════════════════════
function pickItem(idx) {
  var item = MENU_ITEMS[idx];
  if (!item || pausedItems[item.id]) return;
  // every modal session starts from a clean slate → no settings leak between drinks / items
  pendingItem = item; custSel = {}; selToppings = []; selGarnish = []; drinkSel = null;
  if (item.drink) drinkSel = newDrinkSel(item.drink);
  if (!item.mods || !item.mods.length) {               // nothing to choose → add straight away
    addToCart(item, buildStructured(item));
    pendingItem = null; drinkSel = null;
    return;
  }
  renderModal();
}

function optButton(mk, o, sc){
  return '<div class="mod-opt" data-key="' + mk + '" data-id="' + o.id + '" data-sel="' + sc + '" onclick="selOpt(this)">' +
         esc(o.label) + (o.price ? ' +' + gbp(o.price) : '') + '</div>';
}
function groupHTML(mk, sc){
  var md = MODS[mk];
  var h = '<div class="mod-group"><div class="mod-label">' + md.label + (md.req ? ' <span class="req">*</span>' : '') + '</div><div class="mod-opts">';
  md.opts.forEach(function(o){ h += optButton(mk, o, sc); });
  return h + '</div></div>';
}

function renderModal() {
  var item = pendingItem, sc = selClassFor(item.st);
  var h = '<div class="modal-handle"></div>' +
          '<div class="modal-title">' + esc(item.name) + '</div>' +
          '<div class="modal-sub">' + (item.desc ? esc(item.desc) + ' · ' : '') + (item.drink ? 'from ' : '') + gbp(item.p) + '</div>';
  for (var mi = 0; mi < item.mods.length; mi++) {
    var mk = item.mods[mi];
    if (mk === 'DRINK_CUSTOM' || mk === 'SET_DRINK' || mk === 'NOODLE_DRINK') {
      if (mk !== 'DRINK_CUSTOM') h += '<hr class="section-divider">';
      h += '<div id="drink-cfg"></div>';
    } else if (mk === 'TOPPINGS') {
      h += '<hr class="section-divider">' + buildToppingSection(sc);
    } else if (mk === 'GARNISH') {
      h += buildGarnishSection(item, sc);
    } else if (mk === 'NOODLE_TYPE') {
      h += groupHTML('noodle_type', sc);
    } else if (MODS[mk]) {
      h += groupHTML(mk, sc);
    }
  }
  h += '<div class="modal-err" id="modal-err"></div>' +
       '<div class="modal-btns"><button class="modal-cancel" onclick="closeModal()">Cancel</button>' +
       '<button class="modal-confirm" id="modal-confirm" onclick="confirmMod()">Add to order</button></div>';
  document.getElementById('modal-sheet').innerHTML = h;
  document.getElementById('modal-overlay').classList.add('on');
  renderDrinkCfg();
  updateTopStatus();
  updateModalPrice();
}

// ── simple single-choice groups ──
function selOpt(el) {
  var mk = el.getAttribute('data-key'), id = el.getAttribute('data-id'), sc = el.getAttribute('data-sel');
  var sibs = el.parentElement.querySelectorAll('[data-key="' + mk + '"]');
  for (var i = 0; i < sibs.length; i++) sibs[i].classList.remove('sel-w', 'sel-f', 'sel-n');
  el.classList.add(sc);
  custSel[mk] = id;
  clearModalError();
  updateModalPrice();
}

// ── noodle toppings ──
function buildToppingSection(sc) {
  var h = '<div class="mod-group"><div class="mod-label">Toppings</div>' +
          '<div class="mod-hint">First topping included · each additional topping +' + gbp(TOPPING_EXTRA) +
          ' · item surcharges always apply · 🔥 = Fire Station also prepares it</div><div class="mod-opts">';
  TOPPINGS.forEach(function(t){
    var fire = routesToFire(t.id);
    h += '<div class="mod-opt' + (fire ? ' fire-needed' : '') + (t.sur ? ' extra-charge' : '') + '" data-top="' + t.id + '" data-sel="' + sc + '" onclick="togTop(\'' + t.id + '\', this)">' +
         esc(t.name) + (fire ? '<span class="fire-badge">🔥</span>' : '') +
         (t.sur ? '<span class="extra-badge">+' + gbp(t.sur) + '</span>' : '') + '</div>';
  });
  return h + '</div><div class="topping-status" id="top-status"></div></div>';
}
function togTop(id, el) {
  var sc = el.getAttribute('data-sel'), at = -1;
  for (var i = 0; i < selToppings.length; i++) { if (selToppings[i].id === id) { at = i; break; } }
  if (at > -1) { selToppings.splice(at, 1); el.classList.remove('sel-w', 'sel-f', 'sel-n'); }
  else         { selToppings.push({id:id}); el.classList.add(sc); }
  updateTopStatus(); updateModalPrice();
}
function updateTopStatus() {
  var el = document.getElementById('top-status'); if (!el) return;
  var ids = selToppings.map(function(t){ return t.id; });
  var c = toppingsCost(ids);
  el.className = 'topping-status';
  el.textContent = ids.length + ' selected' + (ids.length === 0 ? ' · first topping included' : (c > 0 ? ' · topping charges ' + gbp(c) : ' · included'));
}

// ── garnish ──
function buildGarnishSection(item, sc) {
  var h = '<div class="mod-group"><div class="mod-label">Garnish & extras</div>';
  if (item.defaults && item.defaults.length) h += '<div class="mod-hint">Comes with: ' + esc(item.defaults.join(', ')) + '</div>';
  h += '<div class="mod-opts">';
  GARNISH_OPTS.forEach(function(g){
    if (g.needs && item.defaults && item.defaults.indexOf(g.needs) < 0) return;   // only offer "No X" for things the soup includes
    h += '<div class="mod-opt" data-garnish="' + g.id + '" data-sel="' + sc + '" onclick="togGarnish(\'' + g.id + '\')">' +
         esc(g.label) + (g.price ? ' +' + gbp(g.price) : '') + '</div>';
  });
  return h + '</div></div>';
}
function togGarnish(id) {
  var g = byId(GARNISH_OPTS, id), at = selGarnish.indexOf(id);
  if (at > -1) selGarnish.splice(at, 1);
  else {
    selGarnish = selGarnish.filter(function(o){ var og = byId(GARNISH_OPTS, o); return !(og && og.group === g.group); });  // e.g. "No" vs "Extra" spring onion
    selGarnish.push(id);
  }
  var els = document.querySelectorAll('[data-garnish]');
  for (var i = 0; i < els.length; i++) {
    var on = selGarnish.indexOf(els[i].getAttribute('data-garnish')) > -1;
    els[i].classList[on ? 'add' : 'remove'](els[i].getAttribute('data-sel'));
    if (!on) els[i].classList.remove('sel-w', 'sel-f', 'sel-n');
  }
  updateModalPrice();
}

// ═════════════════════════════════════════════════════════════
// DRINK CONFIGURATOR — one implementation for standalone, set-meal and noodle add-on drinks
// ═════════════════════════════════════════════════════════════
function dOpt(field, val, label, selected, sc){
  return '<div class="mod-opt' + (selected ? ' ' + sc : '') + '" data-dk="' + field + '" data-dv="' + val + '" onclick="setDrinkField(\'' + field + '\',\'' + val + '\')">' + esc(label) + '</div>';
}
function priceTag(def, size, temp, ctx){
  var p = drinkPrice(def, {size:size, temp:temp, toppings:[]}, ctx);
  if (ctx === 'standalone') return gbp(p);
  return p === 0 ? 'included' : '+' + gbp(p);
}
function renderDrinkCfg() {
  var host = document.getElementById('drink-cfg'); if (!host || !pendingItem) return;
  var item = pendingItem, ctx = drinkCtx(item), sc = selClassFor(item.st), h = '';

  // drink picker (set meals and noodle bowls)
  if (ctx !== 'standalone') {
    h += '<div class="mod-group"><div class="mod-label">' + (ctx === 'set' ? 'Included drink' : 'Add a drink (50% off)') + '</div>';
    h += '<div class="mod-hint">' + (ctx === 'set'
      ? '500ml included · 700ml +£1.00 · Matcha +£1.00'
      : '50% off the menu price of the chosen size') + '</div><div class="mod-opts">';
    if (ctx === 'noodle') h += dOpt('drink', 'none', 'No drink', !drinkSel, sc);
    DRINK_LIST.forEach(function(d){
      var tag = d.type === 'soft' ? priceTag(d, null, null, ctx) : priceTag(d, drinkSizes(d, 'cold')[0], 'cold', ctx);
      h += dOpt('drink', d.id, d.name + ' (' + tag + ')', !!(drinkSel && drinkSel.id === d.id), sc);
    });
    h += '</div></div>';
  }

  if (drinkSel) {
    var def = DRINKS[drinkSel.id];
    if (def.type !== 'soft') {
      var temps = drinkTemps(def, ctx);
      if (temps.length > 1) {
        h += '<div class="mod-group"><div class="mod-label">Temperature</div><div class="mod-opts">';
        temps.forEach(function(t){ h += dOpt('temp', t, labelOf(TEMP_OPTS, t), drinkSel.temp === t, sc); });
        h += '</div></div>';
      }
      var sizes = drinkSizes(def, drinkSel.temp || 'cold');
      h += '<div class="mod-group"><div class="mod-label">Size</div><div class="mod-opts">';
      sizes.forEach(function(z){ h += dOpt('size', z, z + 'ml · ' + priceTag(def, z, drinkSel.temp || 'cold', ctx), drinkSel.size === z, sc); });
      h += '</div></div>';
      if (def.type === 'milktea' || def.type === 'matcha') {
        h += '<div class="mod-group"><div class="mod-label">Milk</div><div class="mod-opts">';
        MILK_OPTS.forEach(function(m){ h += dOpt('milk', m.id, m.label, drinkSel.milk === m.id, sc); });
        h += '</div></div>';
      }
      h += '<div class="mod-group"><div class="mod-label">Sugar level</div><div class="mod-opts">';
      SUGAR_OPTS.forEach(function(o){ h += dOpt('sugar', o.id, o.label, drinkSel.sugar === o.id, sc); });
      h += '</div></div>';
      if (drinkSel.temp !== 'hot') {                       // hot drinks have no ice level
        h += '<div class="mod-group"><div class="mod-label">Ice level</div><div class="mod-opts">';
        ICE_OPTS.forEach(function(o){ h += dOpt('ice', o.id, o.label, drinkSel.ice === o.id, sc); });
        h += '</div></div>';
      }
      h += '<div class="mod-group"><div class="mod-label">Drink toppings</div>' +
           '<div class="mod-hint">Includes ' + esc(def.includes) + '. The first topping you choose replaces it (no charge); each additional topping +' + gbp(DRINK_TOPPING_EXTRA) + '.</div><div class="mod-opts">';
      DRINK_TOPPINGS.forEach(function(t){
        h += '<div class="mod-opt' + (drinkSel.toppings.indexOf(t.id) > -1 ? ' ' + sc : '') + '" data-dtop="' + t.id + '" onclick="toggleDrinkTopping(\'' + t.id + '\')">' + esc(t.label) + '</div>';
      });
      h += '</div></div>';
    }
  }
  host.innerHTML = h;
}
function setDrinkField(f, v) {
  if (f === 'drink') { drinkSel = (v === 'none') ? null : newDrinkSel(v); }     // fresh object → nothing carried over from another drink
  else if (drinkSel) {
    var def = DRINKS[drinkSel.id];
    if (f === 'size') drinkSel.size = Number(v);
    else if (f === 'temp') {
      drinkSel.temp = v;
      drinkSel.size = drinkSizes(def, v)[0];           // hot = 350ml, cold = 500ml
      if (v === 'hot') drinkSel.ice = null;            // hot drinks carry no ice level
    } else drinkSel[f] = v;                            // milk / sugar / ice
  }
  renderDrinkCfg(); clearModalError(); updateModalPrice();
}
function toggleDrinkTopping(id) {
  if (!drinkSel) return;
  var at = drinkSel.toppings.indexOf(id);
  if (at > -1) drinkSel.toppings.splice(at, 1); else drinkSel.toppings.push(id);
  renderDrinkCfg(); updateModalPrice();
}

// ── modal helpers ──
function missingRequired(item) {
  var miss = [];
  item.mods.forEach(function(mk){
    if (mk === 'side'        && !custSel.side)        miss.push('Side');
    if (mk === 'sauce'       && !custSel.sauce)       miss.push('Sauce');
    if (mk === 'toast'       && !custSel.toast)       miss.push('Filling');
    if (mk === 'NOODLE_TYPE' && !custSel.noodle_type) miss.push('Noodle base');
  });
  return miss;
}
function showModalError(msg) { var e = document.getElementById('modal-err'); if (e) { e.textContent = msg; e.style.display = 'block'; } }
function clearModalError()   { var e = document.getElementById('modal-err'); if (e) { e.style.display = 'none'; } }
function updateModalPrice() {
  var b = document.getElementById('modal-confirm'); if (!b || !pendingItem) return;
  b.textContent = 'Add to order · ' + gbp(calcItemPrice(pendingItem, buildStructured(pendingItem)));
}
function confirmMod() {
  if (!pendingItem) return;
  var miss = missingRequired(pendingItem);
  if (miss.length) { showModalError('Please choose: ' + miss.join(', ')); return; }
  addToCart(pendingItem, buildStructured(pendingItem));
  closeModal();
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('on');
  pendingItem = null; custSel = {}; selToppings = []; selGarnish = []; drinkSel = null;
}
document.getElementById('modal-overlay').addEventListener('click', function(e){ if (e.target === this) closeModal(); });

// ═════════════════════════════════════════════════════════════
// CART
// ═════════════════════════════════════════════════════════════
function addToCart(item, structured) {
  var p = calcItemPrice(item, structured);
  var lines = summaryLines(item, structured);
  cart.push({
    id: item.id, st: item.st, name: item.name, zh: item.name,    // `zh` kept as an alias so old history records still render
    en: item.desc || '', p: p, qty: 1,
    summary: lines, mods: lines.join(' · '),
    structured: structured,
    fireTops: (item.st === 'noodle' ? fireToppingIds(structured) : []).map(toppingName)
  });
  renderCart();
}
function chgQty(idx, d) {             // quantity edits never touch the saved customisations
  cart[idx].qty += d;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  renderCart();
}
function clearCart() { cart = []; renderCart(); }

function renderCart() {
  var l = document.getElementById('cart-list'), f = document.getElementById('cart-foot');
  if (!cart.length) {
    l.innerHTML = '<div class="empty-msg">Select items above</div>';
    f.style.display = 'none';
    return;
  }
  var tot = 0, h = '';
  for (var i = 0; i < cart.length; i++) {
    var it = cart[i], sub = it.p * it.qty; tot += sub;
    var bc = it.st === 'water' ? 'bw' : (it.st === 'fire' ? 'bf' : 'bn');
    var s = it.structured;
    h += '<div class="crow"><span class="cbadge ' + bc + '">' + STATION_ICON[it.st] + ' ' + STATION_NAME[it.st].replace(' Station', '') + '</span>' +
         '<div style="flex:1"><div class="cname">' + esc(it.name) + '</div>';
    (it.summary || []).forEach(function(line){ h += '<div class="cmods">' + esc(line) + '</div>'; });
    if (it.fireTops && it.fireTops.length) h += '<div class="cmods fire">🔥 Fire Station also prepares: ' + esc(it.fireTops.join(', ')) + '</div>';
    h += '</div>' +
         '<button class="qbtn" onclick="chgQty(' + i + ',-1)">−</button>' +
         '<span class="qty">' + it.qty + '</span>' +
         '<button class="qbtn" onclick="chgQty(' + i + ',1)">+</button>' +
         '<span class="cprice">' + gbp(sub) + '</span></div>';
  }
  l.innerHTML = h;
  document.getElementById('tot').textContent = gbp(tot);
  f.style.display = 'block';
}
function cartTotal() { var t = 0; for (var i = 0; i < cart.length; i++) t += cart[i].p * cart[i].qty; return r2(t); }

// WHATSAPP MESSAGE — built ONLY from structured data
// ═════════════════════════════════════════════════════════════
// ── WhatsApp-only short names, looked up by item id. POS / cart / history names are NOT changed.
//    Anything not listed falls back to its full name. Names are only shortened where the short form stays unambiguous. ──
var WA_SHORT = {
  set_wings:'Wings Set', set_tofu:'Teriyaki Tofu Set', set_brisket:'Brisket Set', set_leg:'Chicken Leg Set',
  app_wonton:'Fried Wonton (6 pcs)', app_oysters:'Fried Oysters (4 pcs)', app_cumin:'Cumin Wings (5 pcs)',
  app_squid:'Salt & Pepper Squid', app_tofu:'Teriyaki Tofu', app_crisps:'Seasoned Crisps',
  app_rice:'Steamed Rice', app_toast:'HK French Toast',
  soup_tomato:'Tomato', soup_hs_mala:'Hot & Sour Mala', soup_hs:'Hot & Sour', soup_mala:'Mala', soup_broth:'Chicken Broth'
};
var WA_SHORT_TOPPING = {
  beef_ball:'Beef Ball', shrimp_wonton:'Wonton', cheese_fish_tofu:'Cheese Fish Tofu', fish_ball:'Fish Ball',
  cuttlefish_ball:'Cuttlefish Ball', beef_slices:'Beef Slices', beef_shin:'Beef Shin', braised_tofu:'Braised Tofu',
  braised_wings:'Braised Wings', braised_egg:'Braised Egg', bean_curd_puff:'Bean Curd Puff', bean_curd_sheet:'Bean Curd Sheet',
  bean_sprouts:'Bean Sprouts', pickled_mustard:'Pickled Greens', cumin_wings:'Cumin Wings',
  fish_spring_roll:'Fish Spring Roll', fried_fish_roll:'Fried Fish Spring Roll',   // kept in full so the two rolls can never be confused
  beef_brisket:'Brisket & Tendon', chicken_leg:'Chicken Leg'
};
var WA_SHORT_DRINK = {
  tw_milk_tea:'Taiwanese Milk Tea', bs_milk_tea:'Brown Sugar Milk Tea', choc_milk_tea:'Chocolate Milk Tea', coconut_milk_tea:'Coconut Milk Tea',
  mango_tea:'Mango Tea', lychee_tea:'Lychee Tea', peach_tea:'White Peach Tea', lemon_tea:'Lemon Tea',
  matcha:'Matcha Latte', soft:'Soft Drink'
};
var WA_SHORT_BASE  = {rice:'Rice Noodle', udon:'Udon', korean:'Korean Noodles'};
var WA_SHORT_SAUCE = {curry:'Curry', teriyaki:'Teriyaki'};

function waName(it)       { return WA_SHORT[it.id] || it.name; }
function waTopping(id)    { return WA_SHORT_TOPPING[id] || toppingName(id); }
function waDrinkName(id)  { return WA_SHORT_DRINK[id] || (DRINKS[id] ? DRINKS[id].name : id); }
function waTable(t)       { return /^takeaway$/i.test(String(t)) ? 'Takeaway' : 'T' + t; }

// One drink → lines:  name ×qty [tag] / size · sugar · ice / temperature · milk / toppings.
// Values are the exact saved selections (nothing defaulted); hot drinks never show ice.
function formatDrinkLine(d, qty, tag) {
  var def = DRINKS[d.id];
  var L = [waDrinkName(d.id) + ' ×' + qty + (tag ? ' [' + tag + ']' : '')];
  if (def.type === 'soft') return L;
  var l2 = [];
  if (d.size)  l2.push(d.size + 'ml');
  if (d.sugar) l2.push(labelOf(SUGAR_OPTS, d.sugar));
  if (d.temp !== 'hot' && d.ice) l2.push(labelOf(ICE_OPTS, d.ice));
  if (l2.length) L.push(l2.join(' · '));
  if (def.type === 'milktea' || def.type === 'matcha') {
    var l3 = [d.temp === 'hot' ? 'Hot' : 'Cold'];
    if (d.milk) l3.push(labelOf(MILK_OPTS, d.milk));
    L.push(l3.join(' · '));
  }
  if (d.toppings && d.toppings.length) L.push('Toppings: ' + d.toppings.map(drinkToppingLabel).join(', '));
  return L;
}
function fireItemLines(it) {
  var s = it.structured || {}, L = [waName(it) + ' ×' + it.qty], l2 = [];
  if (s.side)  l2.push(labelOf(MODS.side.opts, s.side));
  if (s.sauce) l2.push('Sauce: ' + (WA_SHORT_SAUCE[s.sauce] || labelOf(MODS.sauce.opts, s.sauce)));
  if (l2.length) L.push(l2.join(' · '));
  if (s.filling) L.push(labelOf(MODS.toast.opts, s.filling));
  if (s.riceSauce && s.riceSauce !== 'none') L.push('Sauce: ' + (WA_SHORT_SAUCE[s.riceSauce] || labelOf(MODS.rice_sauce.opts, s.riceSauce)));
  return L;
}
function noodleItemLines(it) {
  var s = it.structured || {}, L = [waName(it) + ' ×' + it.qty], l2 = [];
  if (s.noodleBase) l2.push(WA_SHORT_BASE[s.noodleBase] || labelOf(MODS.noodle_type.opts, s.noodleBase));
  if (s.spice)      l2.push(labelOf(MODS.spice.opts, s.spice));
  if (l2.length) L.push(l2.join(' · '));
  if (s.toppings && s.toppings.length) {
    L.push((s.toppings.length > 1 ? 'Toppings: ' : 'Topping: ') +
           s.toppings.map(function(id){ return waTopping(id) + (routesToFire(id) ? ' (Fire)' : ''); }).join(', '));
  }
  var g = (s.garnish || []).filter(function(id){ return id !== 'extra_noodles'; }).map(function(id){ return labelOf(GARNISH_OPTS, id); });
  if (g.length) L.push(g.join(', '));
  if (s.extraNoodles) L.push('Extra Noodles');
  return L;
}
function trimBlank(lines) { while (lines.length && lines[lines.length - 1] === '') lines.pop(); return lines; }

// Compact kitchen message. No prices / totals (those stay in the POS, cart and history).
// `tot` is still accepted so the call in sendOrder() is unchanged.
function buildSmartMessages(byStation, fireTaskTops, waterTaskNotes, table, no, rmk, tot, noodleTaskItems) {
  var ts  = new Date().toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
  var tag = ' | #' + no + ' | ' + waTable(table) + ' | ' + ts;
  // a block = header + groups; groups (one per item) are separated by a blank line so each item's details stay with it
  function block(name, groups) {
    var out = [name + tag];
    groups.forEach(function(g, i){ if (i) out.push(''); out = out.concat(g); });
    return out;
  }
  var out = [];

  // FIRE: sets / appetizers + noodle toppings that Fire must prepare
  var fireG = (byStation.fire || []).map(fireItemLines);
  if (fireTaskTops && fireTaskTops.length) {
    fireG.push(fireTaskTops.map(function(t){ return waTopping(t.id) + ' ×' + t.qty + ' (for Noodle)'; }));
  }
  if (fireG.length) out = out.concat(block('FIRE', fireG));

  // NOODLE: the complete bowl, always
  var noodleG = (byStation.noodle || []).map(noodleItemLines);
  if (noodleTaskItems && noodleTaskItems.length) noodleG.push(noodleTaskItems.map(function(t){ return t.label + ' ×' + t.qty; }));
  if (noodleG.length) out = out.concat(block('NOODLE', noodleG));

  // DRINKS: standalone drinks + set-meal drinks + noodle add-on drinks, each with its own settings
  var drinkG = [];
  (byStation.water || []).forEach(function(it){
    if (it.structured && it.structured.drink) drinkG.push(formatDrinkLine(it.structured.drink, it.qty, ''));
  });
  (waterTaskNotes || []).forEach(function(w){
    drinkG.push(formatDrinkLine(w.drink, w.qty, w.from === 'fire' ? 'Set' : 'Noodle'));
  });
  if (drinkG.length) out = out.concat(block('DRINKS', drinkG));

  if (rmk) { out.push(''); out.push('Note: ' + rmk); }
  return out.join('\n');
}

function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  return Promise.resolve();
}
function showCopyToast() {
  var el = document.createElement('div');
  el.textContent = '✅ Order copied. In WhatsApp, long-press the message box and choose Paste.';
  el.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#25D366;color:#fff;padding:10px 16px;border-radius:10px;font-size:12px;font-weight:600;z-index:9999;max-width:90%;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.2)';
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3500);
}

// ═════════════════════════════════════════════════════════════
// PLACE ORDER → copy message + open WhatsApp group
// ═════════════════════════════════════════════════════════════
function collectOrder(items) {
  var byStation = {}, fireMap = {}, fireOrder = [], waterTaskNotes = [], noodleTaskItems = [];
  items.forEach(function(it){
    if (!byStation[it.st]) byStation[it.st] = [];
    byStation[it.st].push({id: it.id, name: it.name, qty: it.qty, p: it.p, mods: it.mods, summary: it.summary, structured: it.structured || null});
    var s = it.structured;
    if (!s) return;
    // noodle toppings routed to Fire Station (routing by topping id, not by name)
    if (it.st === 'noodle') {
      fireToppingIds(s).forEach(function(id){
        if (!fireMap[id]) { fireMap[id] = {id: id, name: toppingName(id), qty: 0}; fireOrder.push(id); }
        fireMap[id].qty += it.qty;
      });
    }
    // drinks that come with a set meal or a noodle bowl → Drinks Station, with their own settings
    if ((it.st === 'fire' || it.st === 'noodle') && s.drink) {
      waterTaskNotes.push({from: it.st, qty: it.qty, parent: it.name, drink: cleanDrink(s.drink)});
    }
  });
  return {
    byStation: byStation,
    fireTaskTops: fireOrder.map(function(id){ return fireMap[id]; }),
    waterTaskNotes: waterTaskNotes,
    noodleTaskItems: noodleTaskItems
  };
}

function sendOrder() {
  if (!cart.length) return;
  if (!currentTable) { document.getElementById('table-warn').style.display = 'block'; return; }
  var rmk = document.getElementById('rmk').value.trim();
  var tot = cartTotal();
  var no = String(oNo++); while (no.length < 3) no = '0' + no;
  var c = collectOrder(cart);
  var fullMsg = buildSmartMessages(c.byStation, c.fireTaskTops, c.waterTaskNotes, currentTable, no, rmk, tot, c.noodleTaskItems);

  copyToClipboard(fullMsg).then(function(){
    showCopyToast();
    setTimeout(function(){ window.open(WA_GROUP_LINK, '_blank'); }, 400);
  }).catch(function(){
    setTimeout(function(){ window.open(WA_GROUP_LINK, '_blank'); }, 200);
  });

  var now = new Date();
  orderHistory.unshift({
    no: no, table: currentTable, items: JSON.parse(JSON.stringify(cart)), tot: tot, rmk: rmk,
    ts: now.toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'}), iso: now.toISOString()
  });
  saveHistory();
  renderHistory();
  cart = [];
  document.getElementById('rmk').value = '';
  renderCart();
  return fullMsg;
}

// ═════════════════════════════════════════════════════════════
// HISTORY (old records are kept untouched; they simply render with whatever fields they have)
// ═════════════════════════════════════════════════════════════
function renderHistory() {
  var el = document.getElementById('history-body');
  if (!orderHistory.length) { el.innerHTML = '<div class="no-orders">No order history yet</div>'; return; }
  var h = '';
  for (var i = 0; i < orderHistory.length; i++) {
    var o = orderHistory[i];
    h += '<div class="history-card">' +
         '<div class="history-top"><span class="history-table">Table ' + esc(o.table) + '</span><span class="history-time">#' + esc(o.no) + ' · ' + esc(o.ts) + '</span></div>' +
         '<div class="history-items">';
    o.items.forEach(function(it){
      h += '<div>' + esc(it.name || it.zh) + ' ×' + it.qty + '</div>';
      var sub = it.summary || (it.mods ? [it.mods] : []);
      sub.forEach(function(line){ h += '<div class="hsub">' + esc(line) + '</div>'; });
    });
    h += '</div><div class="history-tot" style="margin-top:6px">' + gbp(o.tot) + '</div></div>';
  }
  el.innerHTML = h;
}
function saveHistory() {
  try { localStorage.setItem('volcano_history', JSON.stringify({history: orderHistory, oNo: oNo})); } catch (e) {}
}
function loadHistory() {
  try { var r = localStorage.getItem('volcano_history'); if (r) { var d = JSON.parse(r); if (d.history) { orderHistory = d.history; oNo = d.oNo || 1; } } } catch (e) {}
}
function clearHistory() {
  if (!confirm('Clear all order history? This cannot be undone.')) return;
  orderHistory = []; oNo = 1; saveHistory(); renderHistory(); closeManage();
}

// CSV EXPORT
// ═════════════════════════════════════════════════════════════
function csvCell(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }
function buildCSV() {
  var rows = [['Order No', 'Date', 'Time', 'Table', 'Items', 'Options / toppings / drinks / notes', 'Order Total (£)']];
  var grand = 0;
  orderHistory.forEach(function(o){
    grand += o.tot || 0;
    var items = [], opts = [];
    o.items.forEach(function(it){
      var nm = it.name || it.zh;
      items.push(nm + ' ×' + it.qty + ' (' + gbp(it.p * it.qty) + ')');
      var sub = it.summary || (it.mods ? [it.mods] : []);
      if (sub.length) opts.push(nm + ': ' + sub.join('; '));
    });
    if (o.rmk) opts.push('Order note: ' + o.rmk);
    rows.push(['#' + o.no, o.iso ? new Date(o.iso).toLocaleDateString('en-GB') : '', o.ts, o.table, items.join('\n'), opts.join('\n'), (o.tot || 0).toFixed(2)]);
  });
  rows.push(['', '', '', '', '', 'GRAND TOTAL', grand.toFixed(2)]);
  return rows.map(function(r){ return r.map(csvCell).join(','); }).join('\n');
}
function downloadCSV() {
  if (!orderHistory.length) { alert('No orders to export yet.'); return; }
  var blob = new Blob(['\uFEFF' + buildCSV()], {type: 'text/csv;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'), now = new Date();
  a.href = url; a.download = 'VOLCANO_orders_' + now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate() + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ═════════════════════════════════════════════════════════════
// MANAGE (pause items are stored by item id)
// ═════════════════════════════════════════════════════════════
function openManage() {
  var stKeys = ['water', 'fire', 'noodle'];
  var h = '<div class="modal-handle"></div><div class="modal-title" style="margin-bottom:10px">Manage</div>';
  h += '<div class="wa-info">📲 Orders are copied to the clipboard and this WhatsApp group opens (paste and send manually).</div>';
  h += '<div class="wa-row"><span class="wa-station">🌋 Order group</span><span class="wa-num" style="font-size:10px;word-break:break-all">' + esc(WA_GROUP_LINK) + '</span></div>';
  h += '<div style="display:flex;gap:8px;margin-bottom:14px">' +
       '<button onclick="downloadCSV()" style="flex:1;padding:10px;border:none;border-radius:10px;background:var(--noodle);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">📥 Export orders (CSV)</button>' +
       '<button onclick="clearHistory()" style="flex:1;padding:10px;border:1px solid #c0392b;border-radius:10px;background:transparent;color:#c0392b;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">🗑 Clear history</button></div>';
  h += '<div style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px">Pause items</div>';
  for (var s = 0; s < stKeys.length; s++) {
    var st = stKeys[s];
    h += '<div class="manage-sec">' + STATION_ICON[st] + ' ' + STATION_NAME[st] + '</div>';
    for (var i = 0; i < MENU_ITEMS.length; i++) {
      var it = MENU_ITEMS[i];
      if (it.st !== st) continue;
      var ip = !!pausedItems[it.id];
      h += '<div class="manage-row"><span class="manage-name">' + esc(it.name) + '</span>' +
           '<span class="manage-price">' + gbp(it.p) + '</span>' +
           '<button class="pause-btn' + (ip ? ' paused' : '') + '" onclick="togglePause(\'' + it.id + '\')">' + (ip ? 'Resume' : 'Pause') + '</button></div>';
    }
  }
  h += '<div style="margin-top:16px"><button onclick="closeManage()" style="width:100%;padding:13px;border:none;border-radius:10px;background:var(--text);color:var(--bg);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">Close</button></div>';
  document.getElementById('manage-sheet').innerHTML = h;
  document.getElementById('manage-overlay').classList.add('on');
}
function closeManage() { document.getElementById('manage-overlay').classList.remove('on'); }
function togglePause(id) {
  pausedItems[id] = !pausedItems[id];
  try { localStorage.setItem('volcano_paused_v2', JSON.stringify(pausedItems)); } catch (e) {}
  buildPanels(); openManage();
}
document.getElementById('manage-overlay').addEventListener('click', function(e){ if (e.target === this) closeManage(); });

// ═════════════════════════════════════════════════════════════
// TABS / VIEWS
// ═════════════════════════════════════════════════════════════
function stabSwitch(t) {
  var tabs = ['water', 'fire', 'noodle'];
  for (var i = 0; i < tabs.length; i++) {
    var x = tabs[i];
    document.getElementById('p-' + x).classList[x === t ? 'add' : 'remove']('on');
    document.getElementById('tb-' + x).className = 'stab' + (x === t ? ' on-' + x : '');
  }
}
function vswitch(v) {
  document.getElementById('view-order').classList[v === 'order' ? 'add' : 'remove']('on');
  document.getElementById('view-history').classList[v === 'history' ? 'add' : 'remove']('on');
  document.getElementById('vv-order').classList[v === 'order' ? 'add' : 'remove']('on');
  document.getElementById('vv-history').classList[v === 'history' ? 'add' : 'remove']('on');
  if (v === 'history') renderHistory();
}

// ═════════════════════════════════════════════════════════════
// INIT
// ═════════════════════════════════════════════════════════════
function showFatalError(msg) {
  var el = document.createElement('div');
  el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;color:#fff;padding:12px;font-size:12px;z-index:9999;font-family:monospace;white-space:pre-wrap;';
  el.textContent = '⚠️ Load error:\n' + msg;
  document.body.appendChild(el);
}
try {
  // pause state now keyed by item id → the old index-based key ('volcano_paused') is deliberately ignored
  try { var pp = localStorage.getItem('volcano_paused_v2'); if (pp) pausedItems = JSON.parse(pp); } catch (e) {}
  loadHistory();
  buildTableBtns();
  buildPanels();
  renderHistory();
} catch (initErr) {
  showFatalError(initErr.message + '\n' + (initErr.stack || ''));
}
window.addEventListener('error', function(e){ showFatalError(e.message + ' (line ' + e.lineno + ')'); });
</script>
